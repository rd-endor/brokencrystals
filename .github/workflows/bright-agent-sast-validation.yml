# Bright Agent — SAST + STAR SAST validation for Broken Crystals
#
# Downloads the Endor Labs SAST SARIF artifact produced by the separate
# endor-sast.yml workflow, then has Bright Agent VALIDATE those findings
# against a live STAR/DAST scan (RUN_MODE=validation). No Endor scan runs
# here, and no fix loop runs.
#
# Sequence (two separate workflows, same SARIF env names):
#   1. endor-sast.yml runs and uploads ENDOR_SARIF_ARTIFACT (endor-sast-sarif).
#   2. this workflow starts after that run succeeds (workflow_run).
#
# Keep ENDOR_WORKFLOW / ENDOR_SARIF_* in sync with endor-sast.yml.
#
#   • workflow_run → after a successful Endor Labs SAST run; uses that run's
#                    SARIF and the same commit.
#
# Runner prerequisites: Docker, Docker Compose, Git, curl, sha256sum (all on
# GitHub-hosted `ubuntu-latest`).
#
# Required repository secrets:
#     BRIGHT_TOKEN      Bright API token
#     INFERENCE_TOKEN   API token for your OpenAI-compatible inference endpoint
#   and one repository variable:
#     INFERENCE_URL     that endpoint's base URL (OpenAI, GitHub Models, Ollama, …)
#
# Repo access uses the built-in GITHUB_TOKEN (see `permissions:`).
#
# workflow_run only fires from the copy of this file on the DEFAULT branch.

name: Bright Agent (SAST Validation)

on:
  workflow_run:
    workflows: ["Endor Labs SAST"]
    types: [completed]

# contents: write      → push the validation summary branch
# pull-requests: write → open/update the PR + summary comment + reactions
# statuses: write      → set the commit status
# actions: read        → download the Endor SAST SARIF artifact
permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: read

concurrency:
  group: bright-sast-validation-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  sast-validation:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event != 'pull_request' ||
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      ASSET: bright-agent-linux-x64
      ENDOR_WORKFLOW: endor-sast.yml
      ENDOR_SARIF_ARTIFACT: endor-sast-sarif
      ENDOR_SARIF_FILE: endor-sast.sarif
      ENDOR_NAMESPACE: ${{ vars.ENDOR_NAMESPACE || 'ram-learn' }}
      ENDOR_API: ${{ vars.ENDOR_API || 'https://api.endorlabs.com' }}
      ENDOR_LANGUAGES: javascript,typescript
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Download Endor SARIF artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENDOR_SARIF_ARTIFACT }}
          path: ${{ runner.temp }}/sarif
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download & verify Bright Agent
        working-directory: ${{ runner.temp }}
        run: |
          # Latest release. To pin a version, replace 'latest/download' with
          # 'download/<tag>', e.g. .../releases/download/v0.1.1
          base="https://github.com/NeuraLegion/bright-agent-dist/releases/latest/download"
          curl -fsSL -o "${ASSET}" "${base}/${ASSET}"
          curl -fsSL -o "${ASSET}.sha256" "${base}/${ASSET}.sha256"
          sha256sum -c "${ASSET}.sha256"
          chmod +x "${ASSET}"

      - name: Show all available env variables
        run: env | sort

      - name: Run Bright Agent (SAST validation)
        env:
          LOCAL_REPO_PATH: ${{ github.workspace }}
          REPO_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}
          BRIGHT_HOSTNAME: ${{ vars.BRIGHT_HOSTNAME || 'https://cloud.brightsec.com' }}
          INFERENCE_URL: ${{ vars.INFERENCE_URL }}
          INFERENCE_TOKEN: ${{ secrets.INFERENCE_TOKEN }}
          RUN_MODE: validation
          SARIF_PATH: ${{ runner.temp }}/sarif/${{ env.ENDOR_SARIF_FILE }}
          BRIGHT_DEBUG: "1"
          BRIGHT_DUMP_TURNS: "1"
          BRIGHT_DUMP_DIR: ${{ runner.temp }}/bright-dumps
        run: "${{ runner.temp }}/${{ env.ASSET }}"

      - name: Upload Bright Agent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bright-agent-sast-logs
          path: ~/.bright-agent/logs/
          if-no-files-found: ignore

      - name: Upload LLM turn dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bright-agent-sast-turn-dumps
          path: ${{ runner.temp }}/bright-dumps/
          if-no-files-found: ignore

      - name: Upload Endor SARIF used for validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bright-agent-sast-sarif
          path: ${{ runner.temp }}/sarif/
          if-no-files-found: ignore
