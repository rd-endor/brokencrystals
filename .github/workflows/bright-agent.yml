# Bright Agent (STAR) — GitHub Actions (single workflow, all triggers)
#
# Adapted from the official template:
#   https://github.com/NeuraLegion/bright-agent-dist/blob/main/examples/ci/github-actions.yml
#
# One workflow drives the agent on every entry point:
#   • pull_request      → PR-scoped scan; commits fixes to the PR head branch.
#   • issue_comment     → an OWNER/MEMBER/COLLABORATOR comments `/bright-agent <guidance>`
#                         on a PR to re-run with steering.
#   • workflow_dispatch → manual full scan (use this to smoke-test the setup).
#   • schedule          → nightly full scan.
#
# Broken Crystals is a NestJS + React benchmark app. The agent checks out this
# repo, boots the stack via Docker Compose (compose.local.yml), scans the live
# endpoints, and commits/PRs verified fixes.
#
# Required repo secrets: BRIGHT_TOKEN, INFERENCE_TOKEN
# Required repo variable: INFERENCE_URL (e.g. https://api.anthropic.com)
# Repo access uses the built-in GITHUB_TOKEN (see `permissions:`).
#
# ONE-TIME MANUAL STEP: Settings → Actions → General → Workflow permissions →
# enable "Allow GitHub Actions to create and approve pull requests" (else fix PRs 403).
#
# NOTE: for `/bright-agent` steering to work, this file must live on the DEFAULT branch.

name: Bright Agent (STAR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *" # nightly at 03:00 UTC

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: bright-agent-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  bright-agent:
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/bright-agent') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      # Runner platform/arch: linux-x64 | linux-arm64 | darwin-x64 | darwin-arm64
      ASSET: bright-agent-linux-x64
    steps:
      - name: Resolve steering PR (refuse forks)
        id: steer
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const sameRepo =
              pr.head.repo &&
              pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (!sameRepo) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body:
                  "🔒 `/bright-agent` steering is not available on fork PRs for " +
                  "security reasons (it would run untrusted code with repository " +
                  "secrets). Push the branch to this repository to use it.",
              });
              core.setFailed("Steering disabled on fork PRs.");
              return;
            }
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("base_ref", pr.base.ref);

      - uses: actions/checkout@v5
        with:
          ref: >-
            ${{ (github.event_name == 'issue_comment' && steps.steer.outputs.head_ref)
              || (github.event_name == 'pull_request' && github.event.pull_request.head.ref)
              || github.ref }}
          fetch-depth: 0

      - name: Download & verify Bright Agent
        working-directory: ${{ runner.temp }}
        run: |
          # Latest release. To pin a version, replace 'latest/download' with
          # 'download/<tag>', e.g. .../releases/download/v0.1.1
          base="https://github.com/NeuraLegion/bright-agent-dist/releases/latest/download"
          curl -fsSL -o "${ASSET}" "${base}/${ASSET}"
          curl -fsSL -o "${ASSET}.sha256" "${base}/${ASSET}.sha256"
          sha256sum -c "${ASSET}.sha256"
          chmod +x "${ASSET}"

      - name: Run Bright Agent
        env:
          LOCAL_REPO_PATH: ${{ github.workspace }}
          REPO_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}
          BRIGHT_HOSTNAME: "https://cloud.brightsec.com"
          INFERENCE_URL: ${{ vars.INFERENCE_URL }}
          INFERENCE_TOKEN: ${{ secrets.INFERENCE_TOKEN }}
          # Anthropic Claude — cheapest tier to start; add a comma-separated
          # chain (e.g. "claude-haiku-4-5-20251001,claude-sonnet-5") to auto-escalate.
          AI_MODEL: claude-haiku-4-5-20251001
          # Steering inputs — populated only for a `/bright-agent` comment.
          BRIGHT_STEERING_COMMENT: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          BRIGHT_STEERING_COMMENT_ID: ${{ github.event_name == 'issue_comment' && github.event.comment.id || '' }}
          BRIGHT_STEERING_AUTHOR: ${{ github.event_name == 'issue_comment' && github.event.comment.user.login || '' }}
          BRIGHT_STEERING_AUTHOR_ASSOCIATION: ${{ github.event_name == 'issue_comment' && github.event.comment.author_association || '' }}
          BRIGHT_STEERING_PR_NUMBER: ${{ github.event_name == 'issue_comment' && github.event.issue.number || '' }}
          BRIGHT_STEERING_PR_HEAD: ${{ steps.steer.outputs.head_ref }}
          BRIGHT_STEERING_PR_BASE: ${{ steps.steer.outputs.base_ref }}
          # Optional:
          # SCAN_SCOPE: full      # force a full-repo scan even on a PR
          BRIGHT_DEBUG: "1"
        run: "${{ runner.temp }}/${{ env.ASSET }}"

      - name: Upload Bright Agent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bright-agent-logs
          path: ~/.bright-agent/logs/
          retention-days: 7

# NOTE: commits/PRs/comments made with GITHUB_TOKEN do not trigger your other
# workflows (GitHub's anti-recursion rule). To have fix commits re-run your
# repo's CI (check.yml / check-client.yml), swap REPO_ACCESS_TOKEN to a PAT:
#     REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
